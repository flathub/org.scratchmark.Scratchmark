id: org.scratchmark.Scratchmark
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: scratchmark
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/scratchmark/cargo
modules:

  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Dintrospection=disabled
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.11.tar.xz
        sha256: 52e53ec3fba0f604cfd0931e26af7f7241a0d4f0208dd5574f43b3589f6d28b2
        x-checker-data:
          type: gnome
          version-scheme: odd-minor-is-unstable
          name: libspelling

  - name: scratchmark
    builddir: true
    buildsystem: meson
    config-opts:
      - -Doffline=true
      - -Dbuildtype=release
    sources:
      - type: git
        url: https://github.com/sevonj/scratchmark.git
        tag: v1.11.0
        commit: b987d79562eacf69e63230f0cf20496b547fad54
      - generated-sources.json
